<!--
=== PANDUAN SINGKAT (untuk guru / mahasiswa) ===
AUDIO      : efek & musik dibuat otomatis oleh browser (TANPA file). Mau pakai file sendiri? isi AUDIO_FILES di bagian LOGIKA,
             mis. correct:"assets/audio/correct.mp3". Volume musik awal 12% (slider di header Host).
FONT       : Poppins dimuat dari Google Fonts bila online. Untuk offline penuh taruh Poppins-Regular/SemiBold/ExtraBold.ttf di assets/fonts/.
CARA PAKAI : klik 2x index.html (Chrome/Edge). Itu = HOST MODE (layar guru).
             Klik "BUKA LAYAR PLAYER" -> jendela baru = PLAYER MODE. Seret jendela itu ke proyektor, tekan F11 (layar penuh).
             Keduanya tersinkron otomatis (pakai browser yang sama). Di Player, tombol Esc = kembali ke Host.
STRUKTUR   : cukup 1 file (index.html). CSS di bagian "style", data soal di bagian "DATA SOAL", logika di bagian "LOGIKA".
GANTI SOAL : edit teks "question" di gameData.   GANTI JAWABAN: edit "text".   GANTI POIN: edit "points".
TAMBAH ALIAS: tambahkan teks baru di dalam aliases: ["alias lama", "alias baru"]  (jangan lupa koma & tanda kutip).
TAMBAH RONDE: salin satu blok { round: ..., ... } lengkap, tempel setelah koma blok terakhir, ubah isinya. Nomor ronde otomatis.
BONUS      : isi "bonus: { q: "pertanyaan", key: "kunci untuk guru" }" pada ronde yang diinginkan; "bonus: null" = tanpa bonus.
             Soal Bonus 3 sudah ada (BONUS_3). Untuk memakainya, tulis  bonus: BONUS_3  di ronde pilihan.
RUBRIK     : edit RUBRIK (nama kriteria & skor). Total bonus = jumlah semua skor.
CATATAN    : jika data soal diubah, klik RESET GAME agar tampilan bersih.
-->
<style>
@font-face{font-family:Poppins;font-weight:400;src:local("Poppins Regular"),local("Poppins-Regular"),url(assets/fonts/Poppins-Regular.ttf)}

:root{--bg:#1f0307;--m1:#3a0710;--m2:#5c0a16;--red:#b3122a;--cream:#fff4dc;--gold:#f6c343;--gold2:#ffdf8a;--line:#8a5a0a}

body{margin:0;min-height:100vh;font-family:Poppins,"Segoe UI",system-ui,sans-serif;font-weight:400;color:var(--cream);background:radial-gradient(ellipse at 50% 0,#5a0c18 0,#2a050b 55%,var(--bg) 100%) fixed}

<script>

/* ---- AUDIO: dibuat dengan Web Audio (tanpa file & tanpa internet). Dimainkan dari jendela HOST ---- */
const AUDIO_FILES={correct:"",strike:"",strike3:"",music:""}; // opsional, contoh: correct:"assets/audio/correct.mp3"
const AU={ctx:null,vol:.12,music:true,sfx:true,on:false,step:0,next:0,el:null,
 CH:[[110,220,262,330],[87.3,175,220,262],[130.8,262,330,392],[98,196,247,294]],AR:[1,2,3,2,1,2,3,2],
 init(){if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;this.ctx=new C();this.mg=this.ctx.createGain();this.mg.connect(this.ctx.destination);this.apply()}
  if(this.ctx.state==="suspended")this.ctx.resume();return true},
 apply(){const v=this.music?this.vol:0;if(this.mg)this.mg.gain.value=v;if(this.el)this.el.volume=v},
 tone(f,t,d,type,g,dest,hold){const c=this.ctx,o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.value=f;
  v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.01);if(hold)v.gain.setValueAtTime(g,t+d*.65);v.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(v);v.connect(dest||c.destination);o.start(t);o.stop(t+d+.05)},
 file(k){if(!AUDIO_FILES[k])return false;try{const a=new Audio(AUDIO_FILES[k]);a.volume=.8;a.play().catch(()=>{})}catch(e){}return true},
 correct(){if(!this.sfx||this.file("correct")||!this.init())return;const t=this.ctx.currentTime;   // "cring!"
  [[1319,0],[1760,.09],[2637,.18]].forEach(([f,d])=>this.tone(f,t+d,.6,"triangle",.28));this.tone(3520,t+.18,.45,"sine",.1)},
 strike(n){if(!this.sfx||this.file(n>=3?"strike3":"strike")||!this.init())return;const t=this.ctx.currentTime;   // "tetot!" (strike 3 = lebih panjang & berat)
  const hit=(t0,d,f)=>{[f,f*1.05].forEach(x=>this.tone(x,t0,d,"sawtooth",.2,0,1));this.tone(f*2,t0,d,"square",.06,0,1)};
  hit(t,.45,110);if(n>=3)hit(t+.55,.75,82)},
 start(){if(!this.music||this.on||!this.init())return;this.on=true;
  if(AUDIO_FILES.music){if(!this.el){this.el=new Audio(AUDIO_FILES.music);this.el.loop=true}this.apply();this.el.play().catch(()=>{});return}
  this.next=this.ctx.currentTime+.1;this.iv=setInterval(()=>this.tick(),300)},
 stop(){this.on=false;clearInterval(this.iv);if(this.el)this.el.pause()},
 tick(){const c=this.ctx;while(this.next<c.currentTime+1.5){const s=this.step%32,ch=this.CH[s>>3],i=s&7;
  if(i%4===0)this.tone(ch[0],this.next,.5,"sine",.6,this.mg);
  this.tone(ch[this.AR[i]],this.next,.22,"triangle",.3,this.mg);
  if(i%2===0)this.tone(ch[this.AR[i]]*2,this.next,.12,"square",.04,this.mg);
  this.next+=.268;this.step++}},
 toggle(){this.music=!this.music;this.apply();this.music?this.start():this.stop();render()},
 sfxToggle(){this.sfx=!this.sfx;render()},
 setVol(v){this.vol=+v;this.apply()}};
const audioUI=()=>`<span class="au"><button onclick="AU.toggle()">${AU.music?"🎵 MUSIK ON":"🔇 MUSIK OFF"}</button><button onclick="AU.sfxToggle()">${AU.sfx?"🔔 EFEK ON":"🔕 EFEK OFF"}</button><input type="range" min="0" max="40" value="${Math.round(AU.vol*100)}" oninput="AU.setVol(this.value/100)" title="Volume musik"></span>`;

/* ---- SINKRON ANTAR PERANGKAT: relai gratis ntfy.sh (BUTUH INTERNET; kode ruang = "kata sandi") ---- */
const RELAY={base:"https://ntfy.sh/f100-",es:null,lastSent:"",last:"",timer:null,
 get(){try{return localStorage.getItem("f100_room")||""}catch(e){return ""}},
 set(c){try{c?localStorage.setItem("f100_room",c):localStorage.removeItem("f100_room")}catch(e){}},
 stat(t){this.last=t;const e=document.getElementById("rs");if(e)e.textContent=t},
 on(){const a=new Uint8Array(6);crypto.getRandomValues(a);this.set([...a].map(x=>(x%36).toString(36)).join(""));this.push(true);render()},
 off(){this.set("");this.last="";render()},
 ask(){const c=(prompt("Masukkan kode ruang dari Host:")||"").trim().toLowerCase();if(/^[a-z0-9]{4,}$/.test(c))location.hash="#player/"+c},
 push(force){const c=this.get();if(!c||route().code)return;clearTimeout(this.timer);
  this.timer=setTimeout(()=>{const b=JSON.stringify(S);if(!force&&b===this.lastSent)return;if(b.length>3900)return this.stat("✕ data terlalu besar");this.lastSent=b;
   fetch(this.base+c,{method:"POST",body:b}).then(r=>this.stat(r.ok?"● terkirim "+new Date().toLocaleTimeString():"✕ gagal ("+r.status+")")).catch(()=>this.stat("✕ tidak ada internet"))},250)},
 join(c){this.leave();remoteCode=c;remoteFirst=true;remoteGot=false;
  try{this.es=new EventSource(this.base+c+"/sse?since=latest");
   this.es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.event&&d.event!=="message")return;const n=JSON.parse(d.message);
    if(!n||!n.teams||!n.R||n.R.length!==N)return;S=n;remoteGot=true;render();remoteFirst=false}catch(x){}}}catch(e){}},
 leave(){if(this.es)this.es.close();this.es=null;remoteCode="";remoteGot=false}};
const relayUI=()=>{const c=RELAY.get();return `<span class="au2">${c?`<b>KODE RUANG: ${esc(c)}</b><span id="rs">${esc(RELAY.last)}</span><button onclick="RELAY.push(true)">↻ KIRIM ULANG</button><button onclick="navigator.clipboard&&navigator.clipboard.writeText('${c}')">SALIN KODE</button><button onclick="RELAY.off()">MATIKAN SINKRON</button>`:`<button onclick="RELAY.on()">🔗 AKTIFKAN SINKRON ANTAR PERANGKAT</button>`}<button onclick="RELAY.ask()">📺 JADI PLAYER (KODE RUANG)</button></span>`};

 addBonus(){const R=cur(),p=R.rub.reduce((a,b)=>a+b,0);if(R.bonus)return alert("Bonus ronde ini sudah ditambahkan. Klik RESET BONUS dulu bila ingin menilai ulang.");
  if(!p)return alert("Belum ada komponen yang dicentang.");S.teams[S.active].s+=p;R.bonus={t:S.active,p};save()},
 resetBonus(){const R=cur();if(R.bonus){S.teams[R.bonus.t].s-=R.bonus.p;R.bonus=null}R.rub=RUBRIK.map(()=>0);save()},

};

/* ---- CEK JAWABAN: normalisasi -> persis -> alias -> mengandung frasa -> fuzzy ketat ---- */
const norm=s=>s.toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
function phrases(a){const par=(a.text.match(/\(([^)]*)\)/)||[])[1]||"",main=a.text.replace(/\([^)]*\)/g,"");
 return [[main,"j"],...main.split(/[\/&]/).map(x=>[x,"j"]),[par,"j"],...a.aliases.map(x=>[x,"a"])].map(([x,k])=>[norm(x),k]).filter(([x])=>x.length>2)}
function score(s,p,k){if(s===p)return k==="a"?95:100;
 if(p.length>=6&&(" "+s+" ").includes(" "+p+" "))return 90;           // jawaban siswa memuat frasa lengkap
 if(s.length>=5&&p.includes(s)&&s.length/p.length>=.6)return 80;     // jawaban siswa = sebagian besar frasa
 const v=1-lev(s,p)/Math.max(s.length,p.length);return v>=.86?Math.round(v*85):0}  // fuzzy hanya untuk salah ketik kecil
function find(t){const s=norm(t),g=G(),hits=[];
 g.answers.forEach((a,i)=>{let c=0;phrases(a).forEach(([p,k])=>c=Math.max(c,score(s,p,k)));if(c>=70)hits.push({i,c})});
 hits.sort((x,y)=>y.c-x.c);
 return{hits:hits.slice(0,3),dis:(g.distractors||[]).some(d=>score(s,norm(d),"j")>=70)}}

 if(!R.rev.some(x=>x))[...seen].forEach(k=>k.startsWith(S.r+"-")&&seen.delete(k));
 if(p==="home")h=`<div class="c"><h1>FRIENDS 100</h1><h2>EDISI ATHG</h2><p class="tag">Satu kasus, banyak jawaban.</p><p class="q">Pendidikan Pancasila · Kelas XI</p></div>`;

 else if(p==="game"){
  h=`<div class="top"><span class="brand">FRIENDS 100: EDISI ATHG</span><span>RONDE ${S.r+1}/${N}</span><i class="bar"><u style="width:${(S.r+1)/N*100}%"></u></i>${R.steal?`<span class="st">REBUTAN${R.stealTeam!=null?" : "+esc(S.teams[R.stealTeam].n):""}</span>`:""}</div>
  <h2 class="q">${esc(g.question)}</h2>
  <div class="ans">${g.answers.map((a,i)=>{const o=R.rev[i],k=S.r+"-"+i,f=o&&!seen.has(k);if(o)seen.add(k);
   return `<div class="card${o?" open":""}${f?" fresh":""}"><em>${i+1}</em><span>${o?esc(a.text):"? ? ? ? ? ?"}</span><b>${o?a.points:"--"}</b></div>`}).join("")}</div>
  <div class="sx">STRIKE ${[0,1,2].map(i=>`<s class="${i<R.strikes?"x":""}">✕</s>`).join("")}</div>${board()}`}
 else if(p==="bonus")h=`<div class="c"><h2>BONUS ANALYSIS</h2><div class="big">+${TOT} POINTS</div><h2 class="q" style="color:#3b2314">${esc(g.bonus.q)}</h2><p class="q">Giliran: <b style="color:#3b2314">${esc(S.teams[S.active].n)}</b></p></div>${board()}`;
 else if(p==="final"){const o=Tm().slice().sort((a,b)=>b.s-a.s);h=`<div class="c"><h2>SKOR AKHIR</h2>${o.map((t,i)=>`<div class="t${i===0?" on":""}" style="width:80%"><span>${i+1}. ${esc(t.n)}</span><b>${pad(t.s)}</b></div>`).join("")}</div>`}
 else h=`<div class="c"><h2>REFLEKSI</h2><ol class="rl">${REFLEKSI.map(a=>`<li>${esc(a)}</li>`).join("")}</ol></div>`;
 let fl="";if((route().code?S.flash!==lastFlash&&!remoteFirst:S.flash>lastFlash&&Date.now()-S.flash<1500)){fl=`<div class="fl">${"✕".repeat(R.strikes||1)}</div>`}lastFlash=S.flash;
 return `<div class="stage">${h}</div>${fl}`}

function chkHTML(){const g=G(),R=cur(),c=chk.res;let r="";

  else r+=`<p class="warn">Jawaban tidak dikenali secara otomatis.</p><div class="row"><select id="man">${g.answers.map((a,i)=>R.rev[i]?"":`<option value="${i}">${esc(a.text)}</option>`).join("")}</select><button class="b" onclick="A.manual()">TERIMA JAWABAN MANUAL</button><button class="red" onclick="A.strike()">STRIKE</button></div>`;
  if(c.dis)r+=`<p class="warn">Mirip jawaban jebakan (distraktor): kemungkinan besar salah.</p>`}
 return `<div class="panel"><h3>CEK JAWABAN SISWA</h3><div class="row"><input id="ci" style="flex:1" placeholder="Ketik jawaban siswa..." value="${esc(chk.t)}" oninput="chk.t=this.value" onkeydown="if(event.key==='Enter')A.check()"><button class="b" onclick="A.check()">CEK</button></div>${r}<small>Sistem hanya membantu. Keputusan akhir tetap di guru.</small></div>`}
const navBtns=(k,n)=>`<div class="row">${k?`<button onclick="A.go('${k}')">KEMBALI</button>`:""}${n?`<button class="b" onclick="A.go('${n[0]}')">${n[1]}</button>`:""}</div>`;
function host(){const g=G(),R=cur(),p=S.page;
 let h=`<div class="hd"><b>HOST CONTROL</b>${PAGES.map(([k,l])=>`<button class="chip${k===p?" on":""}" onclick="A.go('${k}')">${l}</button>`).join("")}<button class="b" onclick="window.open('#player','f100player')">BUKA LAYAR PLAYER ↗</button><button onclick="location.hash='#player'">Lihat sebagai Player</button>${audioUI()}${relayUI()}</div>`;
 const one=x=>h+`<main class="one">${x}</main>`;
 if(p==="home")return one(`<div class="panel"><h2>FRIENDS 100: EDISI ATHG</h2><p class="tag">Satu kasus, banyak jawaban.</p><p><b>CP:</b> ${CP}</p><p><b>TP:</b></p><ol>${TP.map(t=>`<li>${t}</li>`).join("")}</ol><p class="note">Langkah: 1) Klik BUKA LAYAR PLAYER dan pindahkan ke proyektor. 2) Atur kelompok. 3) Mulai.</p><button class="b" onclick="A.go('setup',1)">MULAI</button></div>`);
 if(p==="setup")return one(`<div class="panel"><h2>SETUP GROUP</h2><div class="row"><button class="${S.nt===2?"b":""}" onclick="A.nt(2)">2 KELOMPOK</button><button class="${S.nt===3?"b":""}" onclick="A.nt(3)">3 KELOMPOK</button></div>${Tm().map((t,i)=>`<div class="row"><input value="${esc(t.n)}" oninput="A.name(${i},this.value)"></div>`).join("")}${navBtns("home",["how","LANJUT"])}</div>`);
 if(p==="how")return one(`<div class="panel"><h2>HOW TO PLAY</h2><ol>${ATURAN.map(a=>`<li>${esc(a)}</li>`).join("")}</ol>${`<div class="row"><button onclick="A.go('setup')">KEMBALI</button><button class="b" onclick="A.go('game',1)">MULAI PERMAINAN</button></div>`}</div>`);
 if(p==="final")return one(`<div class="panel"><h2>FINAL SCORE</h2>${Tm().slice().sort((a,b)=>b.s-a.s).map((t,i)=>`<div class="tot">${i+1}. ${esc(t.n)} — ${t.s}</div>`).join("")}<p class="note">Ini hanya perhitungan skor permainan.</p>${navBtns("game",["reflection","LANJUT"])}<button class="red" onclick="A.resetGame()">RESET GAME</button></div>`);
 if(p==="reflection")return one(`<div class="panel"><h2>REFLECTION</h2><ol>${REFLEKSI.map(a=>`<li>${esc(a)}</li>`).join("")}</ol>${navBtns("final")}<button class="red" onclick="A.resetGame()">RESET GAME</button></div>`);
 if(p==="bonus"){if(!g.bonus)return one(`<div class="panel"><h2>Ronde ${S.r+1} tidak punya Bonus Analysis</h2>${navBtns("game")}</div>`);
  const sum=R.rub.reduce((a,b)=>a+b,0);
  return one(`<div class="panel"><h2>BONUS ANALYSIS — Ronde ${S.r+1}</h2><p><b>${esc(g.bonus.q)}</b></p><p class="note"><b>Kunci (guru):</b> ${esc(g.bonus.key)}</p>
  ${RUBRIK.map(([l,pt],i)=>`<label class="ck"><input type="checkbox" ${R.rub[i]?"checked":""} onchange="A.rub(${i})"> ${l} +${pt}</label>`).join("")}
  <div class="tot">Total: ${sum} / ${TOT}</div><p>Kelompok aktif: <b>${esc(S.teams[S.active].n)}</b> ${Tm().map((t,i)=>`<button class="${i===S.active?"b":""}" onclick="A.active(${i})">${esc(t.n)}</button>`).join(" ")}</p>
  ${R.bonus?`<p class="ok">Bonus ${R.bonus.p} sudah masuk ke ${esc(S.teams[R.bonus.t].n)}.</p>`:""}
  <div class="row"><button class="b" onclick="A.addBonus()">TAMBAHKAN BONUS KE SKOR</button><button class="red" onclick="A.resetBonus()">RESET BONUS</button><button onclick="A.go('game')">KEMBALI</button></div></div>`)}
 /* GAME */
 const wait=R.steal&&R.stealTeam==null;
 return h+`<main><div>
  <div class="panel"><div class="row"><button onclick="A.prev()" ${S.r===0?"disabled":""}>◀ KEMBALI</button><select onchange="A.round(+this.value)">${gameData.map((x,i)=>`<option value="${i}" ${i===S.r?"selected":""}>Ronde ${i+1}</option>`).join("")}</select><button class="b" onclick="A.next()">${S.r===N-1?"LANJUT (FINAL)":"NEXT ROUND ▶"}</button></div>
  <h3>RONDE ${S.r+1}: ${esc(g.question)}</h3>
  ${g.answers.map((a,i)=>`<div class="ar"><button class="${R.rev[i]?"":"b"}" onclick="A.reveal(${i})" ${R.rev[i]?"disabled":""}>REVEAL ${i+1}</button><div><b>${esc(a.text)}</b> — ${a.points} poin${R.rev[i]?' <span class="ok">✔ terbuka</span>':""}<br><small>Alias: ${a.aliases.map(esc).join(" · ")}</small></div></div>`).join("")}
  <p class="note"><b>Jawaban jebakan:</b> ${(g.distractors||[]).map(esc).join("; ")}<br><b>Debrief:</b> ${esc(g.debrief)}</p></div>
  ${chkHTML()}</div><div>
  <div class="panel"><h3>KELOMPOK AKTIF (poin masuk ke sini)</h3>${Tm().map((t,i)=>`<div class="row"><button class="${i===S.active?"b":""}" style="flex:1" onclick="A.active(${i})">${esc(t.n)}</button><b class="tot" style="font-size:1.5em">${t.s}</b></div>`).join("")}
  <div class="row">Poin manual: ${[-10,-5,5,10].map(n=>`<button onclick="A.add(${n})">${n>0?"+":""}${n}</button>`).join("")}</div></div>
  <div class="panel"><h3>STRIKE: ${R.strikes} / 3</h3><div class="row"><button class="red" onclick="A.strike()" ${R.strikes>=3?"disabled":""}>STRIKE</button><button onclick="A.clearStrike()">HAPUS STRIKE</button><button class="${R.steal?"b":""}" onclick="A.steal()">STEAL ${R.steal?"AKTIF":"OFF"}</button></div>
  ${R.steal?`<p class="${wait?"warn":"ok"}">${wait?"Pilih kelompok yang merebut (poin reveal berikutnya masuk ke kelompok itu):":"Poin reveal masuk ke kelompok perebut."}</p><div class="row">${Tm().map((t,i)=>`<button class="${R.stealTeam===i?"b":""}" onclick="A.stealTo(${i})">${esc(t.n)}</button>`).join("")}</div>`:""}</div>
  <div class="panel"><h3>LAINNYA</h3><div class="row"><button class="b" onclick="A.bonus()" ${g.bonus?"":"disabled"}>BONUS ANALYSIS</button><button class="red" onclick="A.resetRound()">RESET ROUND</button><button class="red" onclick="A.resetGame()">RESET GAME</button></div><small>${g.bonus?"Ronde ini punya Bonus Analysis.":"Ronde ini tidak punya bonus."}</small></div>
  </div></main>`}

function render(){document.title="FRIENDS 100: EDISI ATHG";app.innerHTML=isPlayer()?player():host()}
window.addEventListener("storage",e=>{if(e.key===KEY&&!route().code){load();render()}});
function onRoute(){const r=route();if(r.p&&r.code){if(remoteCode!==r.code)RELAY.join(r.code)}else{RELAY.leave();load()}render()}
window.addEventListener("hashchange",onRoute);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&isPlayer())location.hash=""});
load();lastFlash=S.flash;onRoute();
</script></body></html>
